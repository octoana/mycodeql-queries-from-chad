extensions:
  - addsTo:
      pack: codeql/java-all
      extensible: summaryModel
    data:
      # SqlFormatter.format() static methods - taint flows from SQL input to formatted output
      - [
          "com.github.vertical_blank.sqlformatter",
          "SqlFormatter",
          false,
          "format",
          "",
          "",
          "Argument[0]",
          "ReturnValue",
          "taint",
          "manual"
        ]
      # SqlFormatter$Formatter.format() instance methods - taint flows from SQL input to formatted output
      - [
          "com.github.vertical_blank.sqlformatter",
          "SqlFormatter$Formatter",
          false,
          "format",
          "",
          "",
          "Argument[0]",
          "ReturnValue",
          "taint",
          "manual"
        ]
      # SqlFormatter$Formatter.extend() - builder pattern, returns modified Formatter
      - [
          "com.github.vertical_blank.sqlformatter",
          "SqlFormatter$Formatter",
          false,
          "extend",
          "",
          "",
          "Argument[this]",
          "ReturnValue",
          "value",
          "manual"
        ]
